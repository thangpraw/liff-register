<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ลงทะเบียนสมาชิก | ศูนย์บริการ</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"Sarabun","Helvetica Neue",sans-serif;background:#F4F6F8;color:#1a1a1a;padding-bottom:40px}
  .header{background:linear-gradient(135deg,#06C755,#04A548);color:#fff;padding:28px 20px 44px;text-align:center}
  .avatar{width:74px;height:74px;border-radius:50%;border:3px solid #fff;object-fit:cover;background:#ddd}
  .header h1{font-size:19px;margin-top:12px;font-weight:700}
  .header p{font-size:13px;opacity:.9;margin-top:4px}
  .card{background:#fff;margin:-28px 16px 0;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#333}
  label span{color:#E03131}
  input,select{width:100%;padding:12px 14px;border:1.5px solid #E1E5EA;border-radius:9px;font-size:15px;font-family:inherit;background:#FAFBFC}
  input:focus,select:focus{outline:none;border-color:#06C755;background:#fff}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .consent{display:flex;gap:9px;align-items:flex-start;margin-top:18px;font-size:12.5px;color:#555;line-height:1.55}
  .consent input{width:19px;height:19px;flex-shrink:0;margin-top:1px}
  .btn{width:100%;padding:15px;background:#06C755;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;margin-top:20px;font-family:inherit}
  .btn:disabled{background:#C7CDD3}
  .msg{padding:12px;border-radius:9px;font-size:13.5px;margin-top:14px;display:none;line-height:1.5}
  .msg.err{background:#FFF0F0;color:#C92A2A;display:block}
  .msg.ok{background:#EBFBEE;color:#0B7285;display:block}
  #loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;gap:14px;padding:24px;text-align:center}
  .spin{width:38px;height:38px;border:3.5px solid #E9ECEF;border-top-color:#06C755;border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .appt{background:#fff;margin:14px 16px;border-radius:12px;padding:16px;border-left:4px solid #06C755;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .appt.past{border-left-color:#CED4DA;opacity:.6}
  .appt b{font-size:15px}.appt p{font-size:13px;color:#666;margin-top:4px}
  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:#EBFBEE;color:#0B7285;margin-top:8px}
  h2{font-size:15px;margin:22px 16px 6px;color:#444}
  .retry{margin-top:16px;padding:10px 22px;background:#06C755;color:#fff;border:none;border-radius:8px;font-size:14px;font-family:inherit}
</style>
</head>
<body>

<div id="loading">
  <div class="spin"></div>
  <span id="loadTxt" style="font-size:13px;color:#888">กำลังโหลด LINE SDK...</span>
</div>

<div id="app" style="display:none">
  <div class="header">
    <img id="pic" class="avatar" src="">
    <h1 id="hello">สวัสดีครับ</h1>
    <p id="sub">ลงทะเบียนเพื่อรับการแจ้งเตือนนัดหมาย</p>
  </div>

  <div class="card">
    <form id="form">
      <label>ชื่อ - นามสกุล <span>*</span></label>
      <input name="fullName" placeholder="สมชาย ใจดี" required>

      <label>เบอร์โทรศัพท์ <span>*</span></label>
      <input name="phone" type="tel" inputmode="numeric" placeholder="0812345678" maxlength="10" required>

      <label>อีเมล</label>
      <input name="email" type="email" placeholder="you@email.com">

      <div class="row">
        <div>
          <label>ทะเบียนรถ</label>
          <input name="carPlate" placeholder="1กก 1234" style="text-transform:uppercase">
        </div>
          <div>
    <label>รุ่นรถ</label>
    <select name="carModel">
      <option value="">-- เลือกรุ่นรถ --</option>
      <option>Mazda 2</option>
      <option>Mazda 3</option>
      <option>CX-3</option>
      <option>CX-30</option>
      <option>CX-5</option>
     <option>CX-8</option>
    </select>
  </div>
      </div>
      <div class="consent">
        <input type="checkbox" id="consent" required>
        <label for="consent" style="margin:0;font-weight:400">
          ข้าพเจ้ายินยอมให้เก็บรวบรวมและใช้ข้อมูลส่วนบุคคลเพื่อการแจ้งเตือนนัดหมายและบริการหลังการขาย ตาม พ.ร.บ.คุ้มครองข้อมูลส่วนบุคคล (PDPA)
        </label>
      </div>

      <button type="submit" class="btn" id="submitBtn">ลงทะเบียน</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <div id="apptZone"></div>
</div>

<script>
/* ============ ตั้งค่า 2 บรรทัดนี้ ============ */
const LIFF_ID = "2011384089-Bl2456Zq";
const API_URL = "https://script.google.com/macros/s/AKfycbwY0pu9sS7Mp3Hq_QzGoQWKkryAQ9LzX-so9_DJRIzCrTcO7ZtirpF1A4tKUvPZX0B_/exec";
/* =========================================== */

/* ---------- ตัวโหลด SDK แบบรอจนเสร็จ + มีสำรอง ---------- */
const SDK_URLS = [
  "https://static.line-scdn.net/liff/edge/2/sdk.js",
  "https://cdn.jsdelivr.net/npm/@line/liff@2/dist/liff.js",
  "https://unpkg.com/@line/liff@2/dist/liff.js"
];

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.charset = 'utf-8';
    s.onload = () => resolve(src);
    s.onerror = () => reject(new Error('โหลดไม่ได้: ' + src));
    document.head.appendChild(s);
  });
}

async function ensureLiff(){
  if (typeof window.liff !== 'undefined') return 'cached';
  let lastErr;
  for (const url of SDK_URLS){
    try{
      await loadScript(url);
      if (typeof window.liff !== 'undefined'){
        console.log('✅ LIFF SDK จาก', url, 'v' + liff.getVersion());
        return url;
      }
    }catch(e){ lastErr = e; console.warn(e.message); }
  }
  throw new Error('โหลด LIFF SDK ไม่สำเร็จทุก CDN\n' +
    'สาเหตุที่เป็นไปได้: ไม่มีอินเทอร์เน็ต / Ad Blocker / องค์กรบล็อกโดเมน line-scdn.net');
}

function setLoadText(t){ document.getElementById('loadTxt').textContent = t; }

function fail(msg){
  document.getElementById('loading').innerHTML =
    `<p style="color:#C92A2A;font-size:15px;font-weight:700">เชื่อมต่อไม่สำเร็จ</p>
     <p style="color:#888;font-size:12px;margin-top:10px;white-space:pre-line;line-height:1.6">${msg}</p>
     <button class="retry" onclick="location.reload()">ลองใหม่</button>`;
}

/* ---------- เรียก API ---------- */
async function api(payload){
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
  });
  return res.json();
}

function show(type, text){
  const el = document.getElementById('msg');
  el.className = 'msg ' + type;
  el.textContent = text;
}

let idToken = null;

/* ---------- เริ่มทำงาน ---------- */
async function main(){
  try{
    setLoadText('กำลังโหลด LINE SDK...');
    await ensureLiff();

    setLoadText('กำลังเชื่อมต่อ LIFF...');
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()){
      liff.login({ redirectUri: location.href });
      return;
    }

    setLoadText('กำลังดึงข้อมูลผู้ใช้...');
    const profile = await liff.getProfile();
    idToken = liff.getIDToken();
    if (!idToken) throw new Error('ไม่ได้รับ ID Token\nกรุณาเปิด Scope "openid" ใน LINE Developers Console');

    document.getElementById('pic').src = profile.pictureUrl || '';
    document.getElementById('hello').textContent = 'สวัสดีคุณ ' + profile.displayName;

    const chk = await api({ action:'checkMember', idToken });
    if (chk.ok && chk.registered){
      const m = chk.member, f = document.getElementById('form');
      Object.keys(m).forEach(k => { if (f[k]) f[k].value = m[k] || ''; });
      document.getElementById('consent').checked = true;
      document.getElementById('submitBtn').textContent = 'บันทึกการแก้ไข';
      document.getElementById('sub').textContent = 'คุณลงทะเบียนแล้ว • แก้ไขข้อมูลได้';
      loadAppointments();
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';

  }catch(e){
    fail((e.message || e) + (e.code ? '\n[code: ' + e.code + ']' : ''));
  }
}

document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try{
    const fd = new FormData(ev.target);
    const profile = await liff.getProfile();
    const payload = {
      action:'register', idToken,
      displayName: profile.displayName, pictureUrl: profile.pictureUrl,
      consent: document.getElementById('consent').checked
    };
    fd.forEach((v,k) => payload[k] = v);

    const r = await api(payload);
    if (r.ok){
      show('ok','✅ ลงทะเบียนสำเร็จ! ระบบจะแจ้งเตือนนัดหมายให้คุณทาง LINE อัตโนมัติ');
      setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 1800);
    } else {
      show('err','❌ ' + (r.error || 'เกิดข้อผิดพลาด'));
      btn.disabled = false; btn.textContent = 'ลงทะเบียน';
    }
  }catch(err){
    show('err','❌ ' + err.message);
    btn.disabled = false; btn.textContent = 'ลงทะเบียน';
  }
});

async function loadAppointments(){
  const r = await api({ action:'myAppointments', idToken });
  if (!r.ok || !r.appointments.length) return;
  document.getElementById('apptZone').innerHTML =
    '<h2>📅 นัดหมายของคุณ</h2>' + r.appointments.map(a => `
      <div class="appt ${a.isPast ? 'past' : ''}">
        <b>${a.dateText}</b>
        <p>🕐 ${a.time} น. • ${a.serviceType || '-'}</p>
        <p>📍 ${a.branch || '-'}</p>
        <span class="badge">${a.status || 'scheduled'}</span>
      </div>`).join('');
}

main();
</script>
</body>
</html>
